<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in — Neethi</title><link rel="stylesheet" href="/static/styles.css"><style>.login-page{min-height:100vh;display:grid;place-items:center;padding:1.5rem}.login-card{width:min(430px,100%);padding:2rem;border:1px solid var(--line);border-radius:16px;background:var(--paper)}.login-card h1{margin:1.5rem 0 .4rem}.login-card>p{color:var(--ink-soft)}.login-card label{display:block;margin:1rem 0;font-size:.75rem;font-weight:700}.login-card input{width:100%;margin-top:.4rem;padding:.8rem;border:1px solid var(--line);border-radius:8px;background:#111a28;color:var(--ink)}.login-card button{width:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:0.9rem 1.2rem}.login-error{color:#e38b80!important}.back-home{display:block;margin-top:1.2rem;text-align:center;color:var(--ink-soft)}</style></head><body><main class="login-page"><section class="login-card"><a class="brand" href="/"><span class="brand-mark">නී</span><span><strong>Neethi</strong><small>Administration</small></span></a><h1>Admin sign in</h1><p>Sign in to import, review, and publish legal sources.</p><p class="login-error" id="login-error" hidden>Username or password is incorrect.</p><form method="post" action="/admin/login"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Sign in</button></form><a class="back-home" href="/">← Return to legal guide</a></section></main><script>document.querySelector('#login-error').hidden=!new URLSearchParams(location.search).has('error')</script></body></html>
