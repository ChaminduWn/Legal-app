[project]
name = "sri-lankan-legal-ai"
version = "0.1.0"
description = "Source-grounded Sri Lankan legal information API"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.115",
  "fastembed>=0.7",
  "google-genai>=1.0",
  "numpy>=2.0",
  "pydantic-settings>=2.7",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
